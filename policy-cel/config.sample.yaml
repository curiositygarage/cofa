# Policy Layer (CEL) — Configuration Sample
# Copy to config.yaml and adjust paths/values.
#
# These two keys are the whole surface. lib/policy.py reads `rules_dir` (policy.py:264) and
# `default_action` (:301) and nothing else here. Earlier versions of this file also carried
# `engine`, `log_level` and a `hardening:` block — none of them were ever read, so they
# advertised controls that did not exist and have been removed.

rules_dir: "./rules/"      # Directory containing CEL rule files, loaded from *.cel
                           # Resolved relative to this config file when not absolute

default_action: "DENY"     # Verdict when a rule evaluates to UNKNOWN
                           # Options: DENY, ASK, REPORT, ALLOW
                           # Note: a command that NO rule matches is ALLOW rule=none — this
                           # setting does not apply to it.
